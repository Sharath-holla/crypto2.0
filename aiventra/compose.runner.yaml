# Optional execution profile: a trusted dedicated daemon, never the host Docker socket.
services:
  runner-daemon:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes: ["runner-staging:/jobs", "runner-engine:/var/lib/docker"]
    networks: [runner-control, runner-download]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      retries: 30
  runner:
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile.runner}
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Run scripts/configure.py}
      RUNNER_DAEMON_URL: http://runner-daemon:2375
      GITHUB_PUBLICATION_REPOSITORIES: ${GITHUB_PUBLICATION_REPOSITORIES:-}
      AIVENTRA_GITHUB_TOKEN: ${AIVENTRA_GITHUB_TOKEN:-}
    volumes: ["runner-staging:/jobs"]
    networks: [default, runner-control]
    depends_on: {runner-daemon: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      start_period: 90s
      retries: 30
  worker:
    environment:
      EXECUTION_ENABLED: "true"
      RUNNER_URL: http://runner:8090
    depends_on: {runner: {condition: service_healthy}}
  api:
    environment:
      EXECUTION_ENABLED: "true"
      RUNNER_URL: http://runner:8090
networks:
  runner-control: {internal: true}
  runner-download: {}
volumes: {runner-staging: {}, runner-engine: {}}
