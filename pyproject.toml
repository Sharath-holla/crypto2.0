[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-ai"
version = "0.1.0"
description = "Reproducible cryptocurrency market-data research foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "joblib>=1.4,<2",
    "lightgbm>=4.5,<5",
    "msvc-runtime>=14.44; platform_system == 'Windows'",
    # Joblib 1.5 emits a NumPy 2.5 serialization deprecation; stay below it until fixed.
    "numpy>=2.1,<2.5",
    "pyarrow>=17,<25",
    "pydantic>=2.8,<3",
    "scikit-learn>=1.5,<2",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[project.scripts]
crypto-ai = "crypto_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
