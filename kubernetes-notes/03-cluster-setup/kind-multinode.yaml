# kind config used throughout the handbook: 1 control plane + 2 workers.
# Host ports 80/443 are mapped to NodePorts 30080/30443 on the control-plane container
# so Ingress/Gateway controllers exposed as NodePort are reachable at http://localhost.
#   kind create cluster --config kind-multinode.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  # disableDefaultCNI: true        # install Calico/Cilium yourself (chapter 05.04)
  # kubeProxyMode: "iptables"      # iptables | nftables | ipvs | none
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
